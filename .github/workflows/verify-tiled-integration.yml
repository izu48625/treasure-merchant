name: Verify extraction prototype
on:
  push:
    branches:
      - main
      - feature/r5-33-tiled-main-integration
    paths:
      - 'exploration*.js'
      - 'exploration*.css'
      - 'maps/indoor/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/verify-tiled-integration.yml'
  pull_request:
    paths:
      - 'exploration*.js'
      - 'maps/indoor/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline regression tests
        run: node --test tests/*.test.cjs
