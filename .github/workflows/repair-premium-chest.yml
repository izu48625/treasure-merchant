name: One-time premium chest matte repair
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_premium_chest_matte.py
      - .github/workflows/repair-premium-chest.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-premium-chest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact repository HEAD
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Prepare image libraries
        run: |
          python -m pip install --disable-pip-version-check pillow numpy scipy
      - name: Fix only the left outline of the closed premium chest
        run: |
          python scripts/fix_premium_chest_matte.py
          git diff --check
          git diff --quiet -- assets/gacha/frames/chest_premium_closed.webp && { echo "No chest image changed"; exit 1; } || true
      - name: Commit revised binary image to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gacha/frames/chest_premium_closed.webp
          git commit -m "R5.2.3i: apply audited premium chest left-matte repair [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
