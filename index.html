function svgSeries(values,kind){
 const vals=values.length?values:[0n,0n];if(vals.length===1)vals.push(vals[0]);
 let lo=vals.reduce((a,b)=>a<b?a:b),hi=vals.reduce((a,b)=>a>b?a:b);
 if(kind==='daily'){lo=lo<0n?lo:0n;hi=hi>0n?hi:0n}
 const range=hi-lo||1n;
 const y=v=>108-Number((v-lo)*86n/range);
 let art='';
 if(kind==='daily'){
  const mid=y(0n),width=320/vals.length;
  art=`<line x1="0" y1="${mid}" x2="320" y2="${mid}" stroke="#76899b" stroke-dasharray="3 3"/>`;
  art+=vals.map((v,i)=>{const yy=y(v);return `<rect x="${(i*width+width*.18).toFixed(1)}" y="${Math.min(mid,yy).toFixed(1)}" width="${(width*.64).toFixed(1)}" height="${Math.max(2,Math.abs(mid-yy)).toFixed(1)}" rx="2" fill="${v<0n?'#e08e95':'#7fd0aa'}"/>`}).join('');
 }else{
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*320).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  art=`<polyline fill="none" stroke="#e4bb72" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;
 }
 return `<div class="chart"><svg viewBox="0 0 320 125" preserveAspectRatio="none" role="img" aria-label="${kind==='daily'?'日別損益':'資産'}の推移"><path d="M0 108H320 M0 65H320 M0 22H320" fill="none" stroke="#304355" stroke-width="1"/>${art}</svg></div>`;
}

}

function mostValuableItems(limit=3){
 const best=[],quotes=new Map();
 for(const x of state.inv){
  const key=x.id+'|'+x.q+'|'+(x.replica?1:0);
  let value=quotes.get(key);
  if(value===undefined){value=price(item(x.id),x.q,x.replica);quotes.set(key,value)}
  if(best.length===limit&&value<=best[best.length-1].value)continue;
  let index=best.findIndex(row=>value>row.value);
  if(index<0)index=best.length;
  best.splice(index,0,{entry:x,value});
  if(best.length>limit)best.pop();
 }
 return best.map(row=>row.entry);
}

function pullHTML(){if(typeof gachaPullHTML==='function')return gachaPullHTML();if(!lastPull.length){pullModal=null;return ''}const step=pullModal.step,shown=step>=0&&step<lastPull.length?lastPull[step]:null;const best=lastPull.reduce((a,b)=>RARITY.indexOf(a.it.rarity)>RARITY.indexOf(b.it.rarity)?a:b);return `<div class="modalbackdrop"><section class="modal gacha-reveal-modal ${step>=lastPull.length?(lastPull.length>10?'result-modal bulk-result':'result-modal'):''}" role="dialog" aria-modal="true" aria-label="ガチャ結果"><button class="modal-close" data-overlay-close="1" aria-label="閉じる">×</button><h2>✦ 宝箱の鑑定</h2>${step<0?`<div class="reveal-stage"><div class="small">鑑定待ちの宝物 · ${lastPull.length}点</div><span class="treasure-chest" aria-hidden="true">🧰</span><div class="gold">封印を解いて財宝を鑑定</div><div class="modal-actions"><button class="btn primary" data-reveal="next">開封する</button><button class="btn" data-reveal="skip">まとめて見る</button></div></div>`:step<lastPull.length?`<div class="reveal-stage"><div class="small">${step+1} / ${lastPull.length} · ${RARITY.indexOf(shown.it.rarity)>=4?'✦ 希少な財宝を発見！':'新しい宝物を鑑定'}</div><div class="reveal-single rarity-glow-${shown.it.rarity}" data-rarity="${shown.it.rarity}">${img(shown.it)}${badge(shown.it.rarity)}<strong>${esc(shown.it.name)}</strong><div class="small">品質：${QNAME[shown.q]}</div><div class="kval">${short(price(shown.it,shown.q))}</div></div><div class="modal-actions"><button class="btn primary" data-reveal="next">${step+1===lastPull.length?'結果一覧を見る':'次を開ける'}</button><button class="btn" data-reveal="skip">すべて表示</button></div></div>`:`<div class="spaced result-summary"><span class="small">鑑定完了 · ${lastPull.length}点獲得</span><span class="gold">最高レア：${best.it.rarity}</span></div><div class="reveal-list compact">${lastPull.map(x=>resultTile(x)).join('')}</div><div class="modal-footer gacha-loop-footer">${pullModal.repeat?`<button class="btn primary" data-gacha-repeat="1">🔁 同じ${pullModal.repeat.count}連をもう一度</button>`:''}<button class="btn" data-overlay-close="1">閉じる（獲得済み）</button></div>`}</section></div>`}
function groupDetailHTML(){
 const rows=groupItems(detailModal.groupKey);if(!rows.length){detailModal=null;return ''}
 const it=item(rows[0].id),q=rows[0].q,replica=rows[0].replica,unlocked=rows.filter(x=>!x.locked),protectedN=rows.length-unlocked.length,amount=rows.reduce((sum,x)=>sum+price(it,x.q,x.replica),0n),one=price(it,q,replica);
 return `<div class="modalbackdrop" data-close-overlay="1"><section class="modal tm-collection-modal" role="dialog" aria-modal="true" aria-label="品質別の所持品詳細"><button class="modal-close" data-overlay-close="1" aria-label="閉じる">×</button><h2>所持品をまとめて確認</h2>${treasureCollectionHero(it,q,{replica,value:one})}<div class="tm-detail-management"><h3>同品質の所持品管理</h3><div class="notebox">所持数 ${rows.length}個 / 保護中 ${protectedN}個 / 売却可能 ${unlocked.length}個</div><div class="modal-actions"><button class="btn" data-pick-group="${detailModal.groupKey}" ${!unlocked.length?'disabled':''}>${unlocked.length&&unlocked.every(x=>selected.has(x.uid))?'✓ 一括選択解除':'＋ この品質をまとめて選択'}</button><button class="btn primary" data-sell-group="${detailModal.groupKey}" ${!unlocked.length?'disabled':''}>売却可能な${unlocked.length}個をまとめて売却</button></div><h2>個別管理</h2><div class="group-member-list">${rows.slice(0,100).map((x,i)=>`<div class="group-member"><span>個体 #${x.uid}${x.locked?' 🔒 保護中':''}</span><span>${short(price(it,x.q,x.replica))}</span><button class="btn smallbtn" data-detail-uid="${x.uid}">詳細</button><button class="btn smallbtn" data-lock="${x.uid}">${x.locked?'解除':'保護'}</button></div>`).join('')}</div>${rows.length>100?`<p class="small">最初の100個を表示中（全${rows.length}個）。一括操作は全個体に適用。</p>`:''}</div><div class="modal-footer"><button class="btn full" data-overlay-close="1">閉じる</button></div></section></div>`;
}
function renderOverlay(){const el=document.getElementById('overlayRoot');if(!el)return;el.innerHTML=detailModal?(detailModal.groupKey?groupDetailHTML():detailHTML()):pullModal?pullHTML():'';document.body.style.overflow=(pullModal||detailModal)?'hidden':''}
function openDetail(uidOrId,isUid){pullModal=null;detailModal=isUid?{uid:Number(uidOrId)}:{id:String(uidOrId)};renderOverlay()}
function sellConfirm(ids){const targets=state.inv.filter(x=>ids.some(u=>String(u)===String(x.uid))&&!x.locked);if(!targets.length){toast('売却対象がありません');return}const gain=targets.reduce((s,x)=>s+price(item(x.id),x.q,x.replica),0n),balance=cash(),holdings=ownedValue();const msg=`${targets.length}点を売却しますか？\n\n現金：${short(balance)} → ${short(balance+gain)}\nアイテム総額：${short(holdings)} → ${short(holdings-gain)}\n総資産：${short(balance+holdings)}（変わりません）\n\n※品物は所持品から消えますが、図鑑の発見記録は残ります。`;if(confirm(msg))sell(targets.map(x=>x.uid))}

function render(){if(actionPersisting)return;if(!storageReady){renderStorageGate();return}if(marketAdvance())save();snapshot();recordAchievements();const content={home,explore:explorationScreen,draw,gallery,inventory,market,titles:titlesHTML,arcade,settings};document.getElementById('main').innerHTML=((active==='inventory'||active==='gallery')&&typeof tmCollectionTabs==='function'?tmCollectionTabs(active):'')+(content[active]||home)();document.getElementById('nav').innerHTML=tabs.map(([id,ico,name])=>`<button class="navbtn ${(id===active||(id==='inventory'&&active==='gallery'))?'active':''}" data-tab="${id}" aria-label="${name}" ${(id===active||(id==='inventory'&&active==='gallery'))?'aria-current="page"':''}><span class="symbol" aria-hidden="true">${tmNavIcon(id,ico)}</span><span>${name}</span></button>`).join('');renderOverlay();explorationAfterRender()}
function selectDuplicates(){selected.clear();const ids=[...new Set(state.inv.map(x=>x.id))];for(const id of ids){const l=state.inv.filter(x=>x.id===id&&!x.locked);if(l.length<2)continue;const keep=l.reduce((a,b)=>a.q>b.q?a:b);for(const x of l)if(x.uid!==keep.uid)selected.add(x.uid)}render();toast(`${selected.size}点を選択`)}
function selectBoom(){selected.clear();for(const x of state.inv){if(x.locked)continue;let it=item(x.id),base=BigInt(it.base)*BigInt(QM[x.q])/1000n*(x.replica?450n:1000n)/1000n;if(price(it,x.q,x.replica)*100n>=base*120n)selected.add(x.uid)}render();toast(`${selected.size}点を選択`)}
function delegate(e){const t=e.target.closest('button,[data-detail],[data-detail-uid],[data-group]');if(actionPersisting)return;if(!storageReady&&t&&t.id!=='retryStorage'&&t.id!=='exportSave')return;if(!t){if(e.target.closest('[data-close-overlay]'))closeOverlay();return}if(t.dataset.overlayClose){closeOverlay();return}if(t.dataset.titleView){titleView=t.dataset.titleView==='wealth'?'wealth':'titles';render();return}if(t.dataset.richRegion){if(['world','japan'].includes(t.dataset.richRegion)){richRegion=t.dataset.richRegion;render()}return}if(t.dataset.explore){explorationAction(t);return}if(t.dataset.arcade){arcadeAction(t);return}if(t.dataset.gachaUi){if(typeof gachaUIOption==='function')gachaUIOption(t.dataset.gachaUi);return}if(t.dataset.favoriteId){toggleFavorite(t.dataset.favoriteId);return}if(t.dataset.more){if(t.dataset.more==='gallery')galleryPage++;else if(t.dataset.more==='inventory')inventoryPage++;else return;const y=window.scrollY;render();window.scrollTo(0,y);return}if(t.dataset.marketwindow){marketRange=Number(t.dataset.marketwindow)===168?168:48;marketGraphCursor=null;render();return}if(t.dataset.leagueClaim){return}if(t.dataset.titleCategory){titleCategory=t.dataset.titleCategory;render();return}if(t.dataset.claimTitle){claimTitle(t.dataset.claimTitle);return}if(t.dataset.titleId){const d=TITLE_DEFS.find(x=>x.id===t.dataset.titleId);if(d&&titleUnlocked(d)){state.activeTitle=d.id;save();render()}return}if(t.dataset.chart){if(['total','items','cash','daily'].includes(t.dataset.chart)){chartKind=t.dataset.chart;render()}return}if(t.dataset.marketgroup){if(['すべて',...GROUPS].includes(t.dataset.marketgroup)){marketGraphGroup=t.dataset.marketgroup;render()}return}if(t.dataset.inventoryFilters){inventoryFiltersOpen=!inventoryFiltersOpen;render();return}if(t.dataset.gachaType){if(['normal','era','modern','lux'].includes(t.dataset.gachaType)){gachaSelectedType=t.dataset.gachaType;render()}return}if(t.dataset.gachaQuick){gachaQuickMode=!gachaQuickMode;render();return}
if(t.dataset.gachaPreview!==undefined){
 const index=Number(t.dataset.gachaPreview);
 if(pullModal&&pullModal.step===lastPull.length&&Number.isInteger(index)&&index>=0&&index<lastPull.length){
  gachaInspectIndex=index;renderOverlay();
 }return;
}
if(t.dataset.gachaPreviewClose){
 gachaInspectIndex=null;renderOverlay();return;
}if(t.dataset.gachaRepeat){if(!pullModal||pullModal.step<lastPull.length||!pullModal.repeat)return;const last=pullModal.repeat;pullModal=null;if(typeof gachaInspectIndex!=='undefined')gachaInspectIndex=null;gacha(last.type,last.count,last.mode);return}if(t.dataset.reveal){
 if(!pullModal||!state.gachaReveal)return;
 const previous=pullModal.step;
 const step=t.dataset.reveal==='skip'?lastPull.length:Math.min(lastPull.length,previous+1);
 if(t.dataset.reveal==='next'&&previous<0){
  if(typeof gachaUIPreload==='function')gachaUIPreload(pullModal.repeat?.type||gachaSelectedType);
  if(typeof gachaUIPlay==='function')gachaUIPlay('open');
 }

 // Commit progress before displaying the next revealed item.
 saveWithCommit(()=>{if(pullModal){pullModal.step=step;renderOverlay();if(t.dataset.reveal==='next'&&typeof gachaUIAfterReveal==='function')gachaUIAfterReveal(step,previous)}});
 return;
}if(t.dataset.pickGroup){const rows=groupItems(t.dataset.pickGroup).filter(x=>!x.locked),all=rows.length&&rows.every(x=>selected.has(x.uid));for(const x of rows)all?selected.delete(x.uid):selected.add(x.uid);render();return}if(t.dataset.sellGroup){sellConfirm(groupItems(t.dataset.sellGroup).filter(x=>!x.locked).map(x=>x.uid));return}if(t.dataset.group){pullModal=null;detailModal={groupKey:t.dataset.group};renderOverlay();return}if(t.dataset.detailUid){openDetail(t.dataset.detailUid,true);return}if(t.dataset.detail){openDetail(t.dataset.detail,false);return}if(t.dataset.tab){closeOverlay();if(active==='explore'&&t.dataset.tab!=='explore')explorationLeave();active=t.dataset.tab;lastPull=[];render();scrollTo(0,0);return}if(t.dataset.gacha){if(typeof gachaInspectIndex!=='undefined')gachaInspectIndex=null;gacha(t.dataset.gacha,Number(t.dataset.count),t.dataset.mode);return}if(t.dataset.pick){const u=Number(t.dataset.pick);selected.has(u)?selected.delete(u):selected.add(u);render();return}if(t.dataset.lock){lock(Number(t.dataset.lock));return}if(t.dataset.sell){sellConfirm([t.dataset.sell]);return}if(t.dataset.dup){duplicate(Number(t.dataset.dup));return}switch(t.id){case 'promoteLeague':toast('商人リーグは現在休止中です');break;case 'retryStorage':void retryStorage();break;case 'helpBtn':active='settings';render();break;case 'refillTickets':if(TEST_FREE_GACHA){state.tickets=TICKET_CAP;state.ticketTime=Date.now();save();render();toast('テスト用にガチャ権利を50/50へ補充しました（広告の視聴なし）')}break;case 'pickDuplicates':selectDuplicates();break;case 'pickBoom':selectBoom();break;case 'clearPicked':case 'clearPickedSticky':selected.clear();render();break;case 'sellSelected':case 'sellSelectedSticky':sellConfirm([...selected]);break;case 'advance':toast('相場を早送りする試作機能は終了しました');break;case 'resetSave':if(confirm('セーブデータを初期化しますか？\n元のセーブはJSONバックアップを作成してから置き換えます。'))void replaceGameState(initial(),'reset');break;case 'exportSave':downloadSave(state,'treasure-save-r4.json');break;}}

function refreshSearchResultOnly(id){
 const isGallery=id==='galleryNameSearch',a=document.getElementById(isGallery?'galleryResults':'inventoryResults'),counter=document.getElementById(isGallery?'galleryCount':'inventoryCount');if(!a)return;

 const fresh=temp.querySelector(isGallery?'#galleryResults':'#inventoryResults'),freshCounter=temp.querySelector(isGallery?'#galleryCount':'#inventoryCount');

void bootStorage();window._lastHour=hour();function refreshHourly(){if(!storageReady)return;const h=hour(),ticketChanged=syncTickets(),marketChanged=h!==window._lastHour;if(marketChanged)window._lastHour=h;if(ticketChanged||marketChanged){save();render();if(marketChanged)toast('市場価格を更新しました')}else updateTicketDisplay()}setInterval(refreshHourly,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshHourly()});window.addEventListener('focus',refreshHourly);
