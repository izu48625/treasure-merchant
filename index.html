<style>

.panel{background:var(--panel);border:1px solid var(--stroke);border-radius:15px;padding:14px;margin:12px 0}.panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.panelhead strong{font-size:15px}.event{border-left:3px solid #dba855;padding-left:11px;font-size:13px;line-height:1.8}.event b{color:#f0d69b}.event .signal{color:var(--muted);font-size:11px}

.filter{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin:8px 0 12px}.filter select{background:#1b2735;color:var(--text);border:1px solid var(--stroke);border-radius:9px;padding:9px 7px;max-width:100%;font-size:12px}.inventory{display:flex;flex-direction:column;gap:8px}.inv{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:9px;padding:8px;border-radius:11px;border:1px solid var(--stroke);background:#171f2b}.inv img{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#171a20}.inv .title{font-size:12px;font-weight:800;line-height:1.4}.inv .details{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.55}.inv .act{display:flex;gap:5px;justify-content:flex-end;flex-direction:column}.inv .act button{padding:6px 7px;border-radius:6px;border:1px solid var(--stroke);background:#273443;color:#dce2e8;font-size:11px;min-width:51px}.inv .act button.sell{border-color:#b49464;color:#f5d193}.inv.selected{border-color:var(--gold)}

ht:900;color:#efd19a;margin-top:7px;overflow-wrap:anywhere}.detail-hero .name{font-size:17px;font-weight:850;margin:4px 0}.detail-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail-stats>div{background:#142230;border:1px solid #384b5b;border-radius:10px;padding:9px;font-size:11px;color:#b8c6d3}.detail-stats b{display:block;margin-top:4px;font-size:14px;color:#f0e4cc}.detail-chart{margin-top:15px}.detail-chart svg{width:100%;height:125px;display:block;background:#13212f;border-radius:10px}.modal-hint{font-size:11px;color:#aab7c6;line-height:1.6}.modal-footer{margin-top:15px}.modal[aria-label="ガチャ結果"] .itemname{font-size:10px}@keyframes floatChest{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes appear{from{opacity:0;transform:scale(.87)}to{opacity:1;transform:scale(1)}}@media(max-width:390px){.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail-hero{grid-template-columns:120px minmax(0,1fr)}.modal{padding:14px}}

const VERSION=1, STORAGE='treasure-exchange-demo-r1';
const RARITY=['N','C','R','SR','SSR','UR','EX'],QNAME=['低','中','高','最高'],QM=[700,1000,1600,2800];
const GROUPS=['現代・生活','歴史・武具','宝石・宝飾','骨董・道具','神話・伝説'];
const RARITY_COLOR={N:'#bdc3cf',C:'#75c58d',R:'#69b1e8',SR:'#b497fa',SSR:'#f1c978',UR:'#f58a81',EX:'#fece86'};
let marketRange=48,active='home',categoryFilter='すべて',rarityFilter='すべて',sortOrder='new',selected=new Set(),lastPull=[],displayKind='all',invGroupFilter='すべて',invRarityFilter='すべて',invQualityFilter='すべて',inventoryNameSearch='',galleryNameSearch='',gallerySort='rarity',pullModal=null,detailModal=null,chartKind='total',marketGraphGroup='すべて',titleCategory='all';
const seeded=(x)=>{x=(x|0)^0x6a09e667;x=Math.imul(x^(x>>>16),0x7feb352d);x=Math.imul(x^(x>>>15),0x846ca68b);return (x^(x>>>16))>>>0};
const hash=(s)=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return h>>>0};
const num=(v)=>Math.max(0,Number(v)||0);
const initial=()=>({v:VERSION,cash:'5000',inv:[],disc:{},freeUsed:false,dupStamp:'',seq:1,offset:0,history:[],dailyHistory:[],normalPity:0,sells:0,draws:0,activeTitle:'rookie',unlockedTitles:[],claimedTitles:[],bonusTickets:0,ticketCapVersion:50,tickets:TICKET_CAP,ticketTime:Date.now()});
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE));if(x&&x.v===VERSION&&Array.isArray(x.inv)&&x.disc&&typeof x.cash==='string')return x}catch(e){}return initial()}
let state=load();
if(!Array.isArray(state.dailyHistory))state.dailyHistory=[];
if(!Array.isArray(state.unlockedTitles))state.unlockedTitles=[];
if(!Array.isArray(state.claimedTitles))state.claimedTitles=[];
if(!Number.isFinite(state.bonusTickets)||state.bonusTickets<0)state.bonusTickets=0;
// R3.6の最大10回分のセーブから、R3.7最大50回分へ一度だけ移行する。
if(state.ticketCapVersion!==50){state.ticketCapVersion=50;state.tickets=TICKET_CAP;state.ticketTime=Date.now()}
if(!Number.isInteger(state.normalPity)||state.normalPity<0||state.normalPity>9)state.normalPity=0;
// R1〜R3セーブを保持したまま回復権利だけ追加する（既存プレイヤーは満タンから）。
if(!Number.isInteger(state.tickets)||state.tickets<0||state.tickets>TICKET_CAP)state.tickets=TICKET_CAP;
if(!Number.isFinite(state.ticketTime)||state.ticketTime<=0)state.ticketTime=Date.now();
function syncTickets(at=Date.now()){
 if(!Number.isFinite(state.ticketTime)||state.ticketTime>at){state.ticketTime=at;return false}
 if(state.tickets>=TICKET_CAP){state.tickets=TICKET_CAP;state.ticketTime=at;return false}
 const gain=Math.floor((at-state.ticketTime)/TICKET_RECHARGE_MS);
 if(gain<=0)return false;
 state.tickets=Math.min(TICKET_CAP,state.tickets+gain);
 state.ticketTime=state.tickets===TICKET_CAP?at:state.ticketTime+gain*TICKET_RECHARGE_MS;
 return true;
}
function remainingTicketMs(at=Date.now()){syncTickets(at);return state.tickets===TICKET_CAP?0:Math.max(0,TICKET_RECHARGE_MS-(at-state.ticketTime))}
function clockText(ms){const sec=Math.ceil(ms/1000),m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function ticketMeter(){syncTickets();return `<div class="ticket-meter"><div class="spaced"><strong>🎟️ ガチャ権利 <span class="ticket-value" id="ticketCount">${state.tickets}/${TICKET_CAP}</span></strong><span class="tiny">広告1回＝50回分を予定</span></div><div class="progress" style="margin-top:9px"><span id="ticketFill" style="width:${state.tickets*100/TICKET_CAP}%"></span></div><div class="spaced" style="margin-top:7px"><span class="small">次の自然回復：<b id="ticketTimer">${state.tickets>=TICKET_CAP?'満タン':clockText(remainingTicketMs())}</b></span><span class="tiny">30分で1回分</span></div>${state.bonusTickets? `<div class="tiny">称号報酬の追加権利：${state.bonusTickets}回分</div>`:''}<div class="ticket-testing">🧪 現在は広告未接続のテスト版。ガチャは無制限・権利消費なし。実広告の視聴は発生しません。</div><button class="btn smallbtn" id="refillTickets">テスト用：権利を50回分に補充</button></div>`}
function updateTicketDisplay(){const timer=document.getElementById('ticketTimer');if(timer)timer.textContent=state.tickets>=TICKET_CAP?'満タン':clockText(remainingTicketMs());}
function cash(){return BigInt(state.cash)}
function setCash(x){state.cash=x.toString()}
function now(){return Date.now()+num(state.offset)*3600000}
function hour(){return Math.floor(now()/3600000)}
function day(){const d=new Date(now());return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function format(v){v=BigInt(v);const sign=v<0n?'-':'';if(v<0)v=-v;return sign+v.toLocaleString('ja-JP')+' G'}
function short(v){v=BigInt(v);const arr=[[100000000000000000000n,'垓'],[10000000000000000n,'京'],[1000000000000n,'兆'],[100000000n,'億'],[10000n,'万']];for(const [d,s] of arr){if(v>=d){const i=v/d;const frac=(v%d)*10n/d;return `${i.toLocaleString('ja-JP')}${frac?'.'+frac:''}${s} G`}}return format(v)}
function item(id){return ITEMS.find(x=>x.id===id)}
function ix(x){return GROUPS.indexOf(x)}
function categoryMult(group,h=hour()){const i=ix(group);let z=1000+Math.round(160*Math.sin((h+i*11)/11.0)+75*Math.sin((h+i*7)/31)+24*Math.sin((h+i*9)*1.7));return Math.min(1400,Math.max(700,z))}
function individualMult(it,h=hour()){let n=hash(it.id)%119;return Math.max(830,Math.min(1180,1000+Math.round(88*Math.sin(h/6+n)+42*Math.sin(h/19+n/7))))}
function event(h=hour()){const k=Math.floor(h/9),rnd=seeded(k+5938),idx=rnd%GROUPS.length,dur=1+((rnd>>>6)%3),phase=((h%9)+9)%9,active=phase<dur;return {group:GROUPS[idx],duration:dur,active,start:k*9,end:k*9+dur,bps:1450+((rnd>>>11)%31)*10}}
function eMult(it,h=hour()){const e=event(h);return e.active&&e.group===it.group?e.bps:1000}
function price(it,q=1,replica=false,h=hour()){let v=BigInt(it.base);for(const m of [QM[q],categoryMult(it.group,h),individualMult(it,h),eMult(it,h),replica?450:1000]){v=v*BigInt(m)/1000n}return v<1n?1n:v}
function ownedValue(){return state.inv.reduce((s,x)=>s+price(item(x.id),x.q,x.replica),0n)}
function net(){return cash()+ownedValue()}
function snapshot(){
 const t=hour(),v=net().toString(),c=cash().toString(),items=ownedValue().toString();
 const row={h:t,v,c,items};const last=state.history[state.history.length-1];
 if(last&&last.h===t)Object.assign(last,row);else state.history.push(row);
 if(state.history.length>240)state.history=state.history.slice(-240);
 // R1/R2の古い時刻別記録は残す。現金・所持品内訳は推測で埋めず、R3以降の記録から計測する。
 const key=day(),days=state.dailyHistory,lastDay=days[days.length-1];
 if(lastDay&&lastDay.date===key){lastDay.end=v;lastDay.h=t}
 else{days.push({date:key,start:lastDay?.end??v,end:v,h:t});if(days.length>45)days.splice(0,days.length-45)}
}

function buyChoice(type){const opts={normal:{price:800,weights:BASE_WEIGHTS},era:{price:10000,weights:BASE_WEIGHTS},modern:{price:10000,weights:BASE_WEIGHTS},lux:{price:65000,weights:BASE_WEIGHTS}};return opts[type]||opts.normal}
function choose(weights){let total=weights.reduce((s,x)=>s+x,0),x=Math.random()*total;for(let i=0;i<weights.length;i++){x-=weights[i];if(x<0)return RARITY[i]}return 'N'}
function pickItem(rarity,type){let ar=ITEMS.filter(x=>x.rarity===rarity);if(type==='era'){const old=ar.filter(x=>x.group!=='現代・生活');if(old.length)ar=old}if(type==='modern'){const modern=ar.filter(x=>x.group==='現代・生活');if(modern.length)ar=modern}return ar[Math.floor(Math.random()*ar.length)]}
function quality(rarity='N'){const r=Math.random()*100;if(['SSR','UR','EX'].includes(rarity))return r<70?1:r<95?2:3;return r<30?0:r<80?1:r<97?2:3}
function receive(it,q,replica=false){const serial=state.seq++;const x={uid:serial,id:it.id,q,replica,locked:false,obt:now()};state.inv.push(x);let d=state.disc[it.id]||{best:-1,qty:0};d.best=Math.max(d.best,q);d.qty++;state.disc[it.id]=d;return x}
function gacha(type,count,mode){
 // 高級は10連専用。UR以上の確定枠以外は通常ガチャと同じ排出率。
 if(type==='lux'&&count!==10){toast('高級ガチャは10連専用です');return}
 // 初回10連は既存の一度きりのウェルカム特典。通常・年代別・高級は権利を消費する。
 syncTickets();
 const intro=mode==='intro';
 if(intro&&state.freeUsed){toast('初回無料10連は使用済み');return}
 if(!intro&&!TEST_FREE_GACHA&&state.tickets+state.bonusTickets<count){toast(`権利が不足しています（${state.tickets+state.bonusTickets}回分）。広告報酬または自然回復で補充してください`);return}
 const cost=(!TEST_FREE_GACHA&&!intro)?BigInt(buyChoice(type).price)*BigInt(count):0n;
 if(cash()<cost){toast('所持金が足りません');return}
 if(intro){state.freeUsed=true}else{
  if(!TEST_FREE_GACHA){const useBonus=Math.min(count,state.bonusTickets);state.bonusTickets-=useBonus;const useNormal=count-useBonus;if(useNormal>0&&state.tickets===TICKET_CAP)state.ticketTime=Date.now();state.tickets-=useNormal;}
  if(cost>0n)setCash(cash()-cost);
 }
 const w=buyChoice(type).weights;lastPull=[];
 for(let i=0;i<count;i++){
  let r=choose(w);
  // 全ガチャ共通、10回目SR以上／100回目SSR以上の定期保証。自然排出でリセットしない。
  if(type==='lux'&&i===count-1){
   // 確定枠：UR 99% / EX 1%。ほか9枠は通常ガチャの元の確率のまま。
   r=choose([0,0,0,0,0,990,10]);
  }
  const position=state.draws+i+1;if(position%100===0&&RARITY.indexOf(r)<4)r=choose([0,0,0,0,...BASE_WEIGHTS.slice(4)]);else if(position%10===0&&RARITY.indexOf(r)<3)r=choose([0,0,0,...BASE_WEIGHTS.slice(3)]);const it=pickItem(r,type),q=quality(r);receive(it,q);lastPull.push({it,q});
 }
 state.draws+=count;state.normalPity=state.draws%10;save();active='draw';pullModal={step:-1};detailModal=null;render();
}
function sell(uuids){const s=new Set(uuids.map(String));let total=0n,n=0;const beforeCash=cash(),beforeItems=ownedValue();state.inv=state.inv.filter(x=>{if(!s.has(String(x.uid))||x.locked)return true;const v=price(item(x.id),x.q,x.replica);total+=v;n++;return false});if(!n){toast('売却対象がありません');return}setCash(beforeCash+total);state.sells+=n;selected.clear();pullModal=null;detailModal=null;save();render();toast(`${n}点売却：現金 +${short(total)} / 所持品 −${short(beforeItems-ownedValue())}`)}
function lock(uid){const x=state.inv.find(x=>x.uid===uid);if(x){x.locked=!x.locked;save();render()}}
function duplicate(uid){if(state.dupStamp===day()){toast('複製は1日1回まで');return}const x=state.inv.find(x=>x.uid===uid);if(!x||x.replica){toast('複製品は再複製できません');return}const it=item(x.id),p=price(it,x.q),fee=p/200n>1n?p/200n:1n;if(cash()<fee){toast('複製費用が足りません');return}const rates={N:45,C:35,R:25,SR:15,SSR:8,UR:3,EX:1.5};if(!confirm(`「${it.name}」を複製しますか？\n成功率 ${rates[it.rarity]}% / 費用 ${short(fee)}\n失敗しても元の品物は残ります。`))return;setCash(cash()-fee);state.dupStamp=day();const ok=Math.random()*100<rates[it.rarity];if(ok)receive(it,x.q,true);save();render();toast(ok?'複製に成功！':'複製に失敗…元の品物は無事です')}
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}

function svgSeries(values,kind){
 const vals=values.length?values:[0n,0n];if(vals.length===1)vals.push(vals[0]);
 let lo=vals.reduce((a,b)=>a<b?a:b),hi=vals.reduce((a,b)=>a>b?a:b);
 if(kind==='daily'){lo=lo<0n?lo:0n;hi=hi>0n?hi:0n}
 const range=hi-lo||1n;
 const y=v=>108-Number((v-lo)*86n/range);
 let art='';
 if(kind==='daily'){
  const mid=y(0n),width=320/vals.length;
  art=`<line x1="0" y1="${mid}" x2="320" y2="${mid}" stroke="#76899b" stroke-dasharray="3 3"/>`;
  art+=vals.map((v,i)=>{const yy=y(v);return `<rect x="${(i*width+width*.18).toFixed(1)}" y="${Math.min(mid,yy).toFixed(1)}" width="${(width*.64).toFixed(1)}" height="${Math.max(2,Math.abs(mid-yy)).toFixed(1)}" rx="2" fill="${v<0n?'#e08e95':'#7fd0aa'}"/>`}).join('');
 }else{
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*320).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  art=`<polyline fill="none" stroke="#e4bb72" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" points="${pts}"/>`;
 }
 return `<div class="chart"><svg viewBox="0 0 320 125" preserveAspectRatio="none" role="img" aria-label="${kind==='daily'?'日別損益':'資産'}の推移"><path d="M0 108H320 M0 65H320 M0 22H320" fill="none" stroke="#304355" stroke-width="1"/>${art}</svg></div>`;
}
function linechart(){
 const labels={total:'総資産',items:'アイテム資産',cash:'現金',daily:'日別利益'};
 let vals=[],hint='',first='',last='';
 if(chartKind==='daily'){
  const days=state.dailyHistory.slice(-14);vals=days.map(d=>BigInt(d.end)-BigInt(d.start));
  hint='日別の総資産増減（売却代金そのものは利益ではありません）';
  first=days.length?days[0].date.slice(5):'';last=days.length?days[days.length-1].date.slice(5):'';
 }else{
  const key={total:'v',items:'items',cash:'c'}[chartKind];
  const rec=state.history.filter(x=>x[key]!==undefined).slice(-48);
  vals=rec.map(x=>BigInt(x[key]));hint='記録時点の残高推移（R3以前の内訳は記録なし）';
  first=rec.length?new Date(rec[0].h*3600000).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',hour:'numeric'}):'';
  last=rec.length?new Date(rec[rec.length-1].h*3600000).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric',hour:'numeric'}):'';
 }
 if(!vals.length)vals=[0n];
 const lastVal=vals[vals.length-1];
 return `<div class="charttabs" role="group" aria-label="資産グラフの表示切替">${Object.entries(labels).map(([id,name])=>`<button type="button" class="charttab ${chartKind===id?'active':''}" aria-pressed="${chartKind===id}" data-chart="${id}">${name}</button>`).join('')}</div><div class="chartsummary"><strong class="${chartKind==='daily'?(lastVal>=0n?'up':'down'):'gold'}">${chartKind==='daily'&&lastVal>=0n?'+':''}${short(lastVal)}</strong><span>${chartKind==='daily'?'最新記録日':labels[chartKind]}</span></div>${svgSeries(vals,chartKind)}<div class="chart-dates"><span>${first}</span><span>${last}</span></div><div class="tiny chart-caption">${hint}</div>`;
}

sellConfirm([t.dataset.sell]);return}if(t.dataset.dup){duplicate(Number(t.dataset.dup));return}switch(t.id){case 'helpBtn':active='settings';render();break;case 'refillTickets':if(TEST_FREE_GACHA){state.tickets=TICKET_CAP;state.ticketTime=Date.now();save();render();toast('テスト用にガチャ権利を50/50へ補充しました（広告の視聴なし）')}break;case 'pickDuplicates':selectDuplicates();break;case 'pickBoom':selectBoom();break;case 'clearPicked':selected.clear();render();break;case 'sellSelected':sellConfirm([...selected]);break;case 'advance':state.offset++;save();render();break;case 'resetSave':if(confirm('セーブデータを初期化しますか？\n元に戻せません。')){state=initial();selected.clear();lastPull=[];closeOverlay();save();active='home';render();}break;case 'exportSave':{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='treasure-save-r1.json';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1500);break;}}}

document.body.addEventListener('change',e=>{const t=e.target;if(t.id==='catFilter')categoryFilter=t.value;else if(t.id==='rarityFilter')rarityFilter=t.value;else if(t.id==='gallerySort')gallerySort=t.value;else if(t.id==='sortInv')sortOrder=t.value;else if(t.id==='invGroupFilter')invGroupFilter=t.value;else if(t.id==='invRarityFilter')invRarityFilter=t.value;else if(t.id==='invQualityFilter')invQualityFilter=t.value;else return;render()});// 入力欄は絶対に差し替えない。iPhone Safariの日本語IME変換・カーソル位置を保つ。
function refreshSearchResultOnly(id){
 const isGallery=id==='galleryNameSearch',a=document.getElementById(isGallery?'galleryResults':'inventoryResults'),counter=document.getElementById(isGallery?'galleryCount':'inventoryCount');if(!a)return;
 const temp=document.createElement('div');temp.innerHTML=isGallery?gallery():inventory();
 const fresh=temp.querySelector(isGallery?'#galleryResults':'#inventoryResults'),freshCounter=temp.querySelector(isGallery?'#galleryCount':'#inventoryCount');
 if(fresh)a.innerHTML=fresh.innerHTML;if(counter&&freshCounter)counter.textContent=freshCounter.textContent;
}
document.body.addEventListener('compositionstart',e=>{if(e.target.id==='galleryNameSearch'||e.target.id==='invNameSearch')e.target.dataset.composing='1'});
document.body.addEventListener('compositionend',e=>{const t=e.target;if(t.id!=='galleryNameSearch'&&t.id!=='invNameSearch')return;delete t.dataset.composing;if(t.id==='galleryNameSearch')galleryNameSearch=t.value;else inventoryNameSearch=t.value;refreshSearchResultOnly(t.id)});
document.body.addEventListener('input',e=>{const t=e.target;if(t.id!=='galleryNameSearch'&&t.id!=='invNameSearch')return;if(t.id==='galleryNameSearch')galleryNameSearch=t.value;else inventoryNameSearch=t.value;if(e.isComposing||t.dataset.composing)return;refreshSearchResultOnly(t.id)});document.body.addEventListener('keydown',e=>{if(e.key==='Escape'&&(pullModal||detailModal))closeOverlay();if((e.key==='Enter'||e.key===' ')&&e.target.matches('article[data-detail],article[data-detail-uid]')){e.preventDefault();e.target.click()}});
render();window._lastHour=hour();function refreshHourly(){const h=hour(),ticketChanged=syncTickets(),marketChanged=h!==window._lastHour;if(marketChanged)window._lastHour=h;if(ticketChanged||marketChanged){save();render();if(marketChanged)toast('市場価格を更新しました')}else updateTicketDisplay()}setInterval(refreshHourly,1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshHourly()});window.addEventListener('focus',refreshHourly);
